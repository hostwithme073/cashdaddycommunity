      min-height: 100vh;

    .card {

      padding: 35px 28px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    }

    .logo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 25px;
      border: 4px solid #f3f4f6;
    }

    h1 {
      font-size: 42px;
      color: #111827;
      margin-bottom: 25px;
      line-height: 1.2;
      font-weight: 800;
    }

    .features {
      text-align: left;
      margin: 20px 0 35px;
      color: #4b5563;
      font-size: 22px;
      line-height: 1.9;
    }

    .highlight {
      font-size: 34px;
      font-weight: 800;
      color: #f59e0b;
      margin-bottom: 20px;
    }

    .timer {
      font-size: 30px;
      font-weight: bold;
      color: #16a34a;
      margin-bottom: 30px;
    }

    .join-btn {
      display: block;
      width: 100%;
      padding: 22px;
      border-radius: 60px;
      background: linear-gradient(90deg, #2ea7ff, #0284c7);
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s ease;
      box-shadow: 0 8px 20px rgba(2,132,199,0.35);
    }

    .join-btn:hover {
      transform: scale(1.02);
    }

    .footer {
      margin-top: 28px;
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .features {
        font-size: 18px;
      }

      .highlight {
        font-size: 26px;
      }

  <script>

    const count = document.getElementById('count');

    const timer = setInterval(() => {
      seconds--;
      count.innerText = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = 'https://t.me/+il6kxJ50jWo1MjQ1';
      }
    }, 1000);
  </script>
